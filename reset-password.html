<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Clariva — Free educational resources, CBT practice and AI assistance for Nigerian undergraduate students.">
  <meta name="keywords"
    content="Clariva, free educational materials, undergraduate, FUTA, CBT, past questions, Nigeria students, reset password, password, reset, reset-password">
  <meta name="author" content="Pro Idea">
  <title>Reset Password</title>
  <link rel="icon" type="image/png" href="ClarivaTpLetterMark.png">
  <link rel="stylesheet" href="Stylesheet.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js" defer></script>
  <meta name="robots" content="noindex, nofollow">
</head>

<body>
  <div id="clariva-page-loader" class="clariva-page-loader" role="status" aria-label="Loading Clariva">
    <img src="ClarivaTpLetterMark.png" alt="" class="clariva-loader-mark">
  </div>
    <header id="header">
    <div class="container">
      <div class="header-inner">
        <div class="clariva-navbar-brand" aria-label="Clariva">
          <img src="ClarivaTpWordMark.png" alt="Clariva — From Confusion to Confidence"
            class="clariva-navbar-wordmark">
        </div>

        <a href="index.html" class="header-btn">
          Back
        </a>
      </div>
    </div>
  </header>

  <section class="container resources-section">

    <div class="gate-form" style="max-width:500px;margin:80px auto;">

      <div class="gate-title">
        Reset Your Password
      </div>

      

      <br>

      <div>

        <label class="gate-field-label">
          New Password
        </label>

        <input type="password" id="new-password" class="gate-input" placeholder="Enter new password" minlength="8" autocomplete="new-password" aria-describedby="reset-password-requirements">
        <div class="password-requirements" id="reset-password-requirements" aria-label="Password requirements"><span>8+ characters</span><span>Uppercase</span><span>Lowercase</span><span>Number</span><span>Symbol</span></div>

      </div>

      <br>

      <div>

        <label class="gate-field-label">
          Confirm Password
        </label>

        <input type="password" id="confirm-password" class="gate-input" placeholder="Confirm new password">

      </div>

      <p class="gate-error" id="reset-error">
      </p>

      <button class="gate-btn gate-btn-primary" id="reset-password-button">

        Reset Password →

      </button>

    </div>

    </section>

  <!-- Global Notification Modal -->
  <div id="notification-overlay" class="notification-overlay hidden">

    <div class="notification-modal">

      <div id="notification-icon" class="notification-icon">✓</div>

      <h2 id="notification-title" class="notification-title">
        Success
      </h2>

      <p id="notification-message" class="notification-message">
        Message goes here.
      </p>

      <button id="notification-button" class="gate-btn gate-btn-primary">
        Continue
      </button>

    </div>

  </div>

</body>

</html>
