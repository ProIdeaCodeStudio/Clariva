<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Clariva — Free educational resources, CBT practice and AI assistance for Nigerian undergraduate students.">
  <meta name="keywords"
    content="Clariva, free educational materials, undergraduate, FUTA, CBT, past questions, Nigeria students, reset password, password, reset, reset-password">
  <meta name="author" content="Pro Idea">
  <title>Reset Password</title>
  <link rel="icon" type="image/png" href="ClarivaTpLetterMark.png">
  <link rel="stylesheet" href="Stylesheet.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js?v=20261121-1" defer></script>
  <meta name="robots" content="noindex, nofollow">
  <script src="connectivity.js?v=20261121-2" defer></script>
</head>

<body>
  <div id="clariva-page-loader" class="clariva-page-loader" role="status" aria-label="Loading Clariva">
    <img src="ClarivaTpLetterMark.png" alt="" class="clariva-loader-mark">
  </div>
    <header id="header">
    <div class="container">
      <div class="header-inner">
        <div class="clariva-navbar-brand" aria-label="Clariva">
          <img src="ClarivaTpWordMark.png" alt="Clariva — From Confusion to Confidence"
            class="clariva-navbar-wordmark">
        </div>

        <a href="index.html" class="header-btn">
          Back
        </a>
      </div>
    </div>
  </header>

  <section class="container resources-section">

    <div class="gate-form" style="max-width:500px;margin:80px auto;">

      <div class="gate-title">
        A Quick Security Update
      </div>
      <p class="gate-subtitle" style="margin: 12px 0 24px;">
        To keep your Clariva account secure, we're updating account access. Please reset your password once to continue using your resources.
      </p>

      <div id="mandatory-reset-link-panel" hidden>
        <p class="gate-note" id="mandatory-reset-link-status" aria-live="polite">
          Checking your account...
        </p>
        <button class="gate-btn gate-btn-primary" id="mandatory-reset-link-button" type="button">
          Send Password Reset Link
        </button>
      </div>

      <div id="reset-password-form" hidden>
        <div>
          <label class="gate-field-label" for="new-password">New Password</label>
          <input type="password" id="new-password" class="gate-input"
            placeholder="Enter new password" minlength="8"
            autocomplete="new-password" aria-describedby="reset-password-requirements">
          <div class="password-requirements" id="reset-password-requirements"
            aria-label="Password requirements">
            <span>8+ characters</span><span>Uppercase</span><span>Lowercase</span>
            <span>Number</span><span>Symbol</span>
          </div>
        </div>

        <div>
          <label class="gate-field-label" for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="gate-input"
            placeholder="Confirm new password" autocomplete="new-password">
        </div>

        <p class="gate-error" id="reset-error" aria-live="polite"></p>

        <button class="gate-btn gate-btn-primary" id="reset-password-button" type="button">
          Reset Password →
        </button>
      </div>

    </div>

    </section>

  <!-- Global Notification Modal -->
  <div id="notification-overlay" class="notification-overlay hidden">

    <div class="notification-modal">

      <div id="notification-icon" class="notification-icon">✓</div>

      <h2 id="notification-title" class="notification-title">
        Success
      </h2>

      <p id="notification-message" class="notification-message">
        Message goes here.
      </p>

      <button id="notification-button" class="gate-btn gate-btn-primary">
        Continue
      </button>

    </div>

  </div>

</body>

</html>
