<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clariva — From Confusion to Confidence">
  <meta name="keywords" content="education, students, University, 100 level, 200 level, Clariva, materials, PDF, notes, past questions, answers, solutions">
  <meta name="author" content="Pro Idea">
  <title>Clariva — Admin Dashboard</title>
  <link rel="stylesheet" href="Stylesheet.css">
  <!-- Load EmailJS and Supabase first, then the site script (deferred) -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script> -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js" defer></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
  <header id="header">
    <div class="container">
      <div class="header-inner">
        <div>
          <div class="edu-wordmark">Clariva</div>
          <div class="header-tagline">"From Confusion to Confidence."</div>
        </div>
        <a href="index.html" class="header-btn">Home</a>
      </div>
    </div>
  </header>
  <main class="container" id="admin-dashboard" hidden>
    <section id="features">
  <p class="features-label">Administration</p>
  <h1 class="features-title">Admin Dashboard</h1>

  <div class="features-grid">
    <article class="feature-card">
      <div class="feature-icon">📚</div>
      <h2 class="feature-title">Resource Management</h2>
      <p class="feature-text">
        Manage learning resources and course materials.
      </p>
    </article>

    <article class="feature-card">
      <div class="feature-icon">👥</div>
      <h2 class="feature-title">User Overview</h2>
      <p class="feature-text">
        Review registered users and verification status.
      </p>
    </article>

    <article class="feature-card">
      <div class="feature-icon">📊</div>
      <h2 class="feature-title">Platform Overview</h2>
      <p class="feature-text">
        View resource activity and platform information.
      </p>
    </article>
  </div>
</section>
  </main>
  <script>
  window.addEventListener('load', async () => {
    const dashboard = document.getElementById('admin-dashboard');

    try {
      if (!window.supabaseClient) {
        throw new Error('Supabase client is not initialized.');
      }

      const { data: { user }, error: authError } =
        await window.supabaseClient.auth.getUser();

      if (authError || !user) {
        window.location.replace('index.html#step-1');
        return;
      }

      const { data: profile, error: profileError } =
        await window.supabaseClient
          .from('students')
          .select('Verified, Role')
          .eq('user_id', user.id)
          .single();

      if (profileError || !profile) {
        throw new Error('Unable to verify your account permissions.');
      }

      if (profile.Verified !== true) {
        window.location.replace('index.html#step-2');
        return;
      }

      if (String(profile.Role).toLowerCase() !== 'admin') {
        if (String(profile.Role).toLowerCase() === 'owner') {
          window.location.replace('OwnerDashboard.html');
        } else {
          window.location.replace('Undergraduates.html');
        }
        return;
      }

      if (dashboard) {
        dashboard.hidden = false;
      }
    } catch (error) {
      console.error('Admin Dashboard access check failed:', error);

      document.body.innerHTML = `
        <main class="container">
          <h1>Unable to verify access</h1>
          <p>Please return to Clariva and try again.</p>
          <a href="index.html">Return to Clariva</a>
        </main>
      `;
    }
  });
</script>
</body>
</html>
